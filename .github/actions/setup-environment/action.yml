description: Setup Node.js, pnpm, and caching for datamitsu-config
inputs:
  cache-datamitsu:
    default: "true"
    description: "Whether to cache datamitsu store"
    required: false
  install-dependencies:
    default: "true"
    description: "Whether to run pnpm install"
    required: false
  registry-url:
    default: ""
    description: "npm registry URL (for publishing workflows)"
    required: false
name: Setup Environment
runs:
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      # Auto-detects version from package.json packageManager field
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        cache: "pnpm"
        node-version-file: ".node-version"
        registry-url: ${{ inputs.registry-url != '' && inputs.registry-url || null }}
    - if: ${{ inputs.cache-datamitsu == 'true' }}
      name: Cache datamitsu store
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        key: datamitsu-store-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'datamitsu.config.js') }}
        path: ~/.cache/datamitsu/store
    - if: ${{ inputs.install-dependencies == 'true' }}
      name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
  using: composite
