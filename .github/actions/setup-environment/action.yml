description: Setup Node.js, pnpm, and caching for datamitsu-config

inputs:
  cache-datamitsu:
    default: "true"
    description: "Whether to cache datamitsu store"
    required: false
  install-dependencies:
    default: "true"

    description: "Whether to run pnpm install"
    required: false
  registry-url:
    default: ""
    description: "npm registry URL (for publishing workflows)"
    required: false
name: Setup Environment
runs:
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v5
      # Auto-detects version from package.json packageManager field

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        cache: "pnpm"
        node-version-file: ".node-version"
        registry-url: ${{ inputs.registry-url != '' && inputs.registry-url || null }}

    - if: ${{ inputs.cache-datamitsu == 'true' }}
      name: Cache datamitsu store
      uses: actions/cache@v5
      with:
        key: datamitsu-store-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'datamitsu.config.js') }}
        path: ~/.cache/datamitsu/store
        restore-keys: |
          datamitsu-store-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          datamitsu-store-

    - if: ${{ inputs.install-dependencies == 'true' }}
      name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
  using: composite
