description: Setup Node.js, pnpm, and caching for datamitsu-config
inputs:
  cache-datamitsu:
    default: "true"
    description: "Whether to cache datamitsu store"
    required: false
  cache-pnpm:
    default: "true"
    description: "Whether to cache the pnpm store"
    required: false
  install-dependencies:
    default: "true"
    description: "Whether to run pnpm install"
    required: false
  registry-url:
    default: ""
    description: "npm registry URL (for publishing workflows)"
    required: false
name: Setup Environment
runs:
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Auto-detects version from package.json packageManager field
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        cache: ${{ inputs.cache-pnpm == 'true' && 'pnpm' || '' }}
        node-version-file: ".node-version"
        # setup-node turns a pnpm cache on by itself when package.json names a packageManager.
        package-manager-cache: ${{ inputs.cache-pnpm == 'true' }}
        registry-url: ${{ inputs.registry-url != '' && inputs.registry-url || null }}
    - if: ${{ inputs.cache-datamitsu == 'true' }}
      name: Cache datamitsu store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: datamitsu-store-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'datamitsu.config.js') }}
        path: ~/.cache/datamitsu/store
    - if: ${{ inputs.install-dependencies == 'true' }}
      name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
  using: composite
