concurrency:
  cancel-in-progress: false
  group: "pages"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/setup-environment
      - name: Generate documentation content
        run: pnpm dm exec task -- docs:generate
      - name: Build documentation site
        run: pnpm dm exec task -- docs:build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
name: Documentation
on:
  # Deploy the site only on a stable release (a pushed v* tag) or manually via
  # the "Run workflow" button — never on every push to main, so unreleased work
  # doesn't go live ahead of a release.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
  pages: write
