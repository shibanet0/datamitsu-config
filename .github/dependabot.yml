updates:
  - commit-message:
      include: scope
      prefix: chore
    cooldown:
      default-days: 7
    directory: /docker
    groups:
      all-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies
      - docker
    open-pull-requests-limit: 10
    package-ecosystem: docker
    schedule:
      interval: weekly
  - commit-message:
      prefix: ci
    cooldown:
      default-days: 7
    directory: /
    groups:
      all-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 10
    package-ecosystem: github-actions
    schedule:
      interval: weekly
  - commit-message:
      include: scope
      prefix: chore
    cooldown:
      default-days: 7
    directory: /src/apps/protolint-fix
    groups:
      all-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    package-ecosystem: gomod
    schedule:
      interval: weekly
  - commit-message:
      include: scope
      prefix: chore
    cooldown:
      default-days: 7
    directory: /
    groups:
      all-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies
      - npm
    open-pull-requests-limit: 10
    package-ecosystem: npm
    schedule:
      interval: weekly
    versioning-strategy: auto
version: 2
