updates:
  - commit-message:
      prefix: "build(deps)"
    directory: "/"
    groups:
      commitlint:
        patterns:
          - "@commitlint/*"
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
      prettier:
        patterns:
          - "prettier*"
      typescript:
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "@types/*"

    labels: ["dependencies", "npm"]
    open-pull-requests-limit: 5
    package-ecosystem: "npm"
    schedule:
      day: "monday"
      interval: "weekly"
  - commit-message:
      prefix: "ci(deps)"

    directory: "/"
    labels: ["dependencies", "ci"]
    open-pull-requests-limit: 5
    package-ecosystem: "github-actions"
    schedule:
      day: "monday"
      interval: "weekly"
  - commit-message:
      prefix: "build(deps)"
    directory: "/docker"
    labels: ["dependencies", "docker"]
    open-pull-requests-limit: 3
    package-ecosystem: "docker"
    schedule:
      day: "monday"
      interval: "weekly"
version: 2
