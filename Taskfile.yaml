# Minimum release age (minutes) for `pull-*` registry updates: a new tool release
# is not adopted until it is at least this old. 10080 = 7 days — datamitsu's own
# default, pinned here so the policy is explicit and independent of that default.
env:
  DATAMITSU_MIN_RELEASE_AGE: "10080"
tasks:
  # ──────────────────────────────────────────────
  # Build
  # ──────────────────────────────────────────────
  build:
    cmds:
      - task: sync:datamitsu-version
      - task: oxlint:sync:schema
      - task: build:lib:datamitsu-types
      - task: build:inline
      - pnpm exec tsdown
      - task: build:datamitsu-config
      - task: docker:generate
    desc: Full build (sync-version → oxlint → datamitsu-types → build:inline → tsdown → datamitsu-config → docker:generate)
  build:agents-md:
    cmds:
      - node scripts/gen-agents-md.ts
    desc: Regenerate src/datamitsu-config/agents.md.ts from agents-md-chunks/
  build:datamitsu-config:
    cmds:
      - pnpm exec tsdown --config ./tsdown.config.datamitsu.ts --config-loader unrun
      # The generated baseline is a gitignored before-config; the hand-written
      # datamitsu.config.ts at the root layers project overrides (expectChainHash)
      # on top of it. Drop any stale root datamitsu.config.js (e.g. left by a prior
      # `npm pack`) so auto-discovery resolves the .ts, not the generated baseline.
      - mv dist-datamitsu-config/datamitsu.config.js datamitsu.config.base.js
      - rm -f datamitsu.config.js
      - pnpm dm init
    desc: Build datamitsu.config.base.js and reinitialise datamitsu
  build:inline:
    deps:
      - task: build:agents-md
      - task: build:skills
      - task: build:tsconfig-md
      - task: build:inline:eslint
      - task: build:inline:prettier
      - task: build:inline:commitlint
      - task: build:inline:knip
      - task: build:inline:cspell
      - task: build:inline:oxfmt
    desc: Build all inline configs in parallel
  build:inline:commitlint:
    cmds:
      - pnpm exec tsdown --config tsdown.config.commitlint.ts --config-loader unrun
    desc: Build inline commitlint config
  build:inline:cspell:
    cmds:
      - pnpm exec tsdown --config tsdown.config.cspell.ts --config-loader unrun
    desc: Build inline cspell config
  build:inline:eslint:
    cmds:
      - pnpm exec tsdown --config tsdown.config.eslint.ts --config-loader unrun
    desc: Build inline eslint config
  build:inline:knip:
    cmds:
      - pnpm exec tsdown --config tsdown.config.knip.ts --config-loader unrun
    desc: Build inline knip config
  build:inline:oxfmt:
    cmds:
      - pnpm exec tsdown --config tsdown.config.oxfmt.ts --config-loader unrun
    desc: Build inline oxfmt config
  build:inline:prettier:
    cmds:
      - pnpm exec tsdown --config tsdown.config.prettier.ts --config-loader unrun
    desc: Build inline prettier config
  build:lib:
    cmds:
      - task: build:lib:datamitsu-types
    desc: Build library artifacts (datamitsu-types)
  build:lib:datamitsu-types:
    cmds:
      - echo "// prettier-ignore" > src/datamitsu-config/datamitsu.config.d.ts
      - pnpm dm config types >> src/datamitsu-config/datamitsu.config.d.ts
    desc: Generate datamitsu.config.d.ts type file
  build:skills:
    cmds:
      - node scripts/gen-skills.ts
    desc: Regenerate src/datamitsu-config/skills.ts from skills-chunks/
  build:tsconfig-md:
    cmds:
      - node scripts/gen-tsconfig-md.ts
    desc: Regenerate src/datamitsu-config/tsconfig.md.ts from docs/reference/tsconfig.md
  # ──────────────────────────────────────────────
  # dependabot (manual — upstream schema changes rarely)
  # ──────────────────────────────────────────────
  dependabot:codegen:
    cmds:
      - pnpm exec json2ts --input dependabot_2.0_schema.json --output src/datamitsu-config/setup/dependabot_schema.d.ts
    desc: Generate TypeScript types from the Dependabot JSON schema
  dependabot:sync:schema:
    cmds:
      - node scripts/sync-dependabot-schema.ts
      - task: dependabot:codegen
    desc: Fetch the Dependabot 2.0 schema from schemastore.org and regenerate types
  # ──────────────────────────────────────────────
  # Docker
  # ──────────────────────────────────────────────
  docker:generate:
    cmds:
      - node scripts/generate-dockerfiles.ts --offline
    desc: Regenerate docker/Dockerfile{,.alpine} from the config via devtools dockerfile
  docs:build:
    cmds:
      - pnpm dm exec zensical -- build
    desc: Build Zensical documentation site
  docs:clean:
    cmds:
      - rm -rf site/
    desc: Clean generated site directory
  # ──────────────────────────────────────────────
  # Docs
  # ──────────────────────────────────────────────
  docs:generate:
    deps:
      - docs:generate:apps
      - docs:generate:tools
      - docs:generate:project-types
      - docs:generate:setup-configs
    desc: Generate all documentation
  docs:generate:apps:
    cmds:
      - node scripts/generate-docs-apps.ts
    desc: Generate docs/reference/apps.md from config
  docs:generate:project-types:
    cmds:
      - node scripts/generate-docs-project-types.ts
    desc: Generate docs/reference/project-types.md from project config
  docs:generate:setup-configs:
    cmds:
      - node scripts/generate-docs-setup-configs.ts
    desc: Generate docs/reference/setup-configs.md from setup config
  docs:generate:tools:
    cmds:
      - node scripts/generate-docs-tools.ts
    desc: Generate docs/reference/tools.md from tools config
  docs:serve:
    cmds:
      - pnpm dm exec zensical -- serve --dev-addr 0.0.0.0:8000
    desc: Serve documentation site locally (http://localhost:8000)
  oxlint:codegen:
    cmds:
      - pnpm exec json2ts --input oxlint_configuration_schema.json --output src/apps/oxlint/schema.d.ts
    desc: Generate TypeScript types from oxlint JSON schema
  # ──────────────────────────────────────────────
  # oxlint
  # ──────────────────────────────────────────────
  oxlint:sync:schema:
    cmds:
      - node scripts/oxlint-sync-schema.ts
      - task: oxlint:codegen
    desc: Sync oxlint schema from node_modules and regenerate types
  pull:external:
    cmds:
      - node scripts/pull-external-apps.ts ./src/datamitsu-config/registries/externalApps.json
    desc: Pull external app registry (verify hashes only)
  pull:external:update:
    cmds:
      - node scripts/pull-external-apps.ts --update ./src/datamitsu-config/registries/externalApps.json
    desc: Pull external app registry with update flag
  # ──────────────────────────────────────────────
  # Pull / registry update
  # ──────────────────────────────────────────────
  pull:github:
    cmds:
      - pnpm datamitsu devtools pull-github --verify-extraction ./src/datamitsu-config/registries/githubApps.json
      - pnpm dm fix ./src/datamitsu-config/registries/githubApps.json
    desc: Pull GitHub app registry (verify extraction only)
  pull:github:update:
    cmds:
      - pnpm datamitsu devtools pull-github --verify-extraction --update ./src/datamitsu-config/registries/githubApps.json
      - pnpm dm fix ./src/datamitsu-config/registries/githubApps.json
    desc: Pull GitHub app registry with update flag
  # ──────────────────────────────────────────────
  # Pull / registry update
  # ──────────────────────────────────────────────
  pull:node:
    cmds:
      - pnpm dm devtools pull-node ./src/datamitsu-config/registries/nodeVersions.json
      - node scripts/sync-node-versions-to-package-json.ts
      - pnpm dm fix ./src/datamitsu-config/registries/nodeVersions.json
    desc: Pull node versions (no update)
  pull:node:update:
    cmds:
      - pnpm dm devtools pull-node --update ./src/datamitsu-config/registries/nodeVersions.json
      - node scripts/sync-node-versions-to-package-json.ts
      - pnpm dm fix ./src/datamitsu-config/registries/nodeVersions.json
    desc: Pull node versions with update flag
  pull:runtimes:update:
    cmds:
      - pnpm dm devtools pull-runtimes --update ./src/datamitsu-config/registries/runtimes.json
      - pnpm dm fix ./src/datamitsu-config/registries/runtimes.json
    desc: Pull runtimes registry with update flag
  pull:uv:
    cmds:
      - pnpm dm devtools pull-uv ./src/datamitsu-config/registries/uvVersions.json
      - pnpm dm fix ./src/datamitsu-config/registries/uvVersions.json
    desc: Pull uv versions (no update)
  pull:uv:update:
    cmds:
      - pnpm dm devtools pull-uv --update ./src/datamitsu-config/registries/uvVersions.json
      - pnpm dm fix ./src/datamitsu-config/registries/uvVersions.json
    desc: Pull uv versions with update flag
  # ──────────────────────────────────────────────
  # Misc
  # ──────────────────────────────────────────────
  s0:
    cmds:
      - pnpm exec tsdown --silent
      - node bin/s0.js
    desc: Build silently then run s0
  # ──────────────────────────────────────────────
  # Sync
  # ──────────────────────────────────────────────
  sync:datamitsu-version:
    cmds:
      - node scripts/sync-datamitsu-version.ts
    desc: Sync @datamitsu/datamitsu min version from package.json into datamitsu.config.ts
  # ──────────────────────────────────────────────
  # Test
  # ──────────────────────────────────────────────
  test:platform:darwin:
    cmds:
      - node scripts/test-platforms.ts darwin --skip-passed
    desc: Run platform tests for darwin, skipping passed
  test:platform:linux-amd64:
    cmds:
      - node scripts/test-platforms.ts linux-amd64 --skip-passed
    desc: Run platform tests for linux-amd64, skipping passed
  test:platform:linux-arm64:
    cmds:
      - node scripts/test-platforms.ts linux-arm64 --skip-passed
    desc: Run platform tests for linux-arm64, skipping passed
  # ──────────────────────────────────────────────
  # Validation
  # ──────────────────────────────────────────────
  validate:blocklist:
    cmds:
      - node scripts/validate-registry-blocklist.ts
    desc: Validate registry files against blocklist
version: "3"
