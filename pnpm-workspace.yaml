  eslint-plugin-clsx: 0.1.0
  eslint-plugin-command: 4.0.0
  eslint-plugin-compat: 7.0.2
  eslint-plugin-de-morgan: 2.1.3
  eslint-plugin-decorator-position: 6.1.1
