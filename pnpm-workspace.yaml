allowBuilds:
  esbuild: false
  unrs-resolver: false
enableGlobalVirtualStore: true
enablePrePostScripts: false
hoistPattern: []
minimumReleaseAgeExclude:
  - "@datamitsu/*"
  - "@ovineko/*"
optimisticRepeatInstall: true
overrides:
